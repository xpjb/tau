[package]
name = "tau-transfer"
version = "0.1.0"
edition = "2024"

[dependencies]
tau-blocks = { path = "../blocks" }
futures-util = "0.3"
zstd = { version = "0.13", default-features = false }
anyhow = "1"
bao-tree = { version = "0.15.1", default-features = false, features = ["tokio_fsm", "validate"] }
blake3 = "1.8"
bytes = "1"
iroh = { version = "=0.35.0", default-features = false }
iroh-blobs = { version = "=0.35.0", default-features = false, features = ["fs-store"] }
iroh-io = "0.6.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
