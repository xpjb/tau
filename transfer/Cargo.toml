[package]
name = "tau-transfer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["ffi"]
ffi = ["dep:uniffi"]
bindgen = ["ffi", "uniffi/cli"]

[dependencies]
anyhow = "1"
bao-tree = { version = "0.15.1", default-features = false, features = ["tokio_fsm", "validate"] }
blake3 = "1.8"
bytes = "1"
iroh = { version = "=0.35.0", default-features = false }
iroh-blobs = { version = "=0.35.0", default-features = false, features = ["fs-store"] }
iroh-io = "0.6.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uniffi = { version = "=0.31.0", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tau-transfer-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]
