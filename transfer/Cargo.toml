[package]
name = "tau-transfer"
version = "0.1.0"
edition = "2024"

[dependencies]
tau-blocks = { path = "../blocks" }
futures-util = "0.3"
zstd = { version = "0.13", default-features = false }
anyhow = "1"
blake3 = "1.8"
iroh = { version = "=0.35.0", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
