[package]
name = "tau-launcher"
version = "0.5.5"
edition = "2024"
build = "build.rs"

[features]
beta = []

[[bin]]
name = "tau-beta-launcher"
path = "src/beta.rs"
required-features = ["beta"]

[build-dependencies]
winresource = "0.1"

[dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com_Urlmon",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
