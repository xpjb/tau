[package]
name = "tau-setup"
version = "0.1.0"
edition = "2024"

[dependencies]
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["lzma"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }
